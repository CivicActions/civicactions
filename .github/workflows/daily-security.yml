name: "Daily Security Audit"

on:
  schedule:
    - cron: "0 14 * * *" # Daily at 14:00 UTC (06:00/07:00 PT)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: "Audit Dependencies & Live Security Advisories"
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Checkout master tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@c54fbc0777231c0f82b5377710e0e0cf55448378 # v2.32.0
        with:
          php-version: "8.3"
          tools: composer:v2

      - name: Setup Terminus
        uses: ./.github/actions/terminus-setup
        with:
          pantheon-machine-token: ${{ secrets.TERMINUS_MACHINE_TOKEN }}

      - name: Run Composer & Drupal Advisories Audit
        id: audit-check
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PANTHEON_SITE: ${{ vars.PANTHEON_SITE || 'civicactions' }}
          REPO: ${{ github.repository }}
        run: |
          source .github/ci/pantheon.sh

          echo "Running composer audit..."
          COMPOSER_AUDIT_RAW=$(composer audit --locked --format=json 2>/dev/null || echo "{}")

          echo "Running drush pm:security on live..."
          PM_SECURITY_RAW=$(drush live -- pm:security --format=json 2>/dev/null || echo "{}")

          export COMPOSER_AUDIT_RAW
          export PM_SECURITY_RAW

          python3 .github/ci/daily-security-audit.py

      - name: Alert on Uncovered Advisories
        if: steps.audit-check.outputs.has_findings == 'true'
        uses: ./.github/actions/notify
        with:
          kind: "security-advisory"
          title: "Security Advisories Detected without Fix PR"
          body: ${{ env.REPORT_BODY || 'Security advisories detected on site.' }}
          resolved: "false"
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          github-token: ${{ steps.app-token.outputs.token }}

      - name: Resolve Stale Advisory Alert
        if: steps.audit-check.outputs.has_findings == 'false'
        uses: ./.github/actions/notify
        with:
          kind: "security-advisory"
          title: "Security Advisories Resolved"
          body: "All detected security advisories have been resolved or have active PRs."
          resolved: "true"
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          github-token: ${{ steps.app-token.outputs.token }}
