name: "Automated Deploy Gate"

on:
  schedule:
    # 16:05 and 17:05 UTC covers window opening under both PDT and PST
    - cron: "5 16,17 * * 1-4"
  workflow_call:
    inputs:
      nested:
        description: "Set automatically when called from another workflow that already holds the pantheon-deploy lock"
        type: boolean
        default: true
  workflow_dispatch:

# Only top-level runs take the shared lock. A called workflow requesting its
# caller's group deadlocks, so nested runs use a run-scoped group instead.
concurrency:
  group: ${{ inputs.nested && format('pantheon-deploy-gate-{0}', github.run_id) || 'pantheon-deploy' }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  deployments: read

jobs:
  evaluate:
    name: "Evaluate Gate"
    runs-on: ubuntu-latest
    outputs:
      decision: ${{ steps.gate.outputs.decision }}
      target_sha: ${{ steps.gate.outputs.target_sha }}
      gate_json: ${{ steps.gate.outputs.gate_json }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Checkout master tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terminus
        uses: ./.github/actions/terminus-setup
        with:
          pantheon-machine-token: ${{ secrets.TERMINUS_MACHINE_TOKEN }}
          pantheon-ssh-key: ${{ secrets.PANTHEON_SSH_KEY }}

      - name: Collect State and Evaluate Gate
        id: gate
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          DEPLOY_WINDOW_VAR: ${{ vars.DEPLOY_WINDOW }}
          AUTO_DEPLOY_ENABLED_VAR: ${{ vars.AUTO_DEPLOY_ENABLED || 'false' }}
        run: |
          source .github/ci/pantheon.sh

          DEV_SHA=$(env_sha dev)
          TEST_SHA=$(env_sha test)
          LIVE_SHA=$(env_sha live)
          MASTER_SHA=$(git rev-parse HEAD)

          echo "Dev: ${DEV_SHA}"
          echo "Test: ${TEST_SHA}"
          echo "Live: ${LIVE_SHA}"
          echo "Master: ${MASTER_SHA}"

          # 1. Check window (deploy-window.mjs has the same default built in)
          WINDOW_ARGS=()
          if [[ -n "${DEPLOY_WINDOW_VAR}" ]]; then
            WINDOW_ARGS=(--window "${DEPLOY_WINDOW_VAR}")
          fi
          WINDOW_RES=$(node .github/ci/deploy-window.mjs "${WINDOW_ARGS[@]}")
          IN_WINDOW=$(echo "${WINDOW_RES}" | jq -r .open)
          echo "In window: ${IN_WINDOW}"

          # 2. Check live precheck
          LIVE_CLEAN="true"
          if ! .github/ci/live-precheck.sh >/dev/null 2>&1; then
            LIVE_CLEAN="false"
          fi
          echo "Live clean: ${LIVE_CLEAN}"

          # 3. Check track record
          TRACK_RECORD=$(.github/ci/deployment-record.sh count-manual)
          echo "Manual track record: ${TRACK_RECORD}"

          # 4. Fetch commits and evaluate gate
          export DEV_SHA TEST_SHA LIVE_SHA MASTER_SHA IN_WINDOW LIVE_CLEAN TRACK_RECORD
          python3 .github/ci/auto-deploy-gate-runner.py

      - name: Notify Blocked Auto-Deployment
        if: steps.gate.outputs.decision == 'blocked'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          TARGET_SHA: ${{ steps.gate.outputs.target_sha }}
        run: |
          REASONS=$(jq -r '.reasons[]' gate-eval.json 2>/dev/null || echo "Unknown reasons")
          HAS_SECURITY_PR=$(jq -e '.commits[] | select(.labels[] == "deps:security-verified")' gate-state.json >/dev/null 2>&1 && echo "true" || echo "false")

          # Only alert if there is actually a pending security PR blocked from deploying
          if [[ "${HAS_SECURITY_PR}" == "true" ]]; then
            echo "Security commits are pending but blocked from automatic deployment:"
            echo "${REASONS}"

            gh api "repos/${REPO}/issues" \
              -f title="Automated Deployment Blocked for Pending Security Updates" \
              -f body="Automated live deployment was evaluated and blocked for the following reasons:\n\n${REASONS}\n\nTarget SHA: ${TARGET_SHA}" \
              -f labels='["ci-alert:deploy-blocked"]' || true
          else
            echo "No pending security PRs to deploy. Gate evaluation complete without action."
          fi

  deploy:
    name: "Automated Deployment"
    needs: [evaluate]
    if: needs.evaluate.outputs.decision == 'deploy'
    permissions:
      contents: read
      deployments: write
      issues: write
    uses: ./.github/workflows/deploy.yml
    with:
      trigger: "auto"
      expected_sha: ${{ needs.evaluate.outputs.target_sha }}
      gate_json: ${{ needs.evaluate.outputs.gate_json || '{}' }}
    secrets: inherit
