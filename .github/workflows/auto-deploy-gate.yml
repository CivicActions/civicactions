name: "Automated Deploy Gate"

on:
  schedule:
    # 16:05 and 17:05 UTC covers window opening under both PDT and PST
    - cron: "5 16,17 * * 1-4"
  workflow_call:
  workflow_dispatch:

concurrency:
  group: pantheon-deploy
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  deployments: read

jobs:
  evaluate-and-deploy:
    name: "Evaluate Gate & Trigger Deploy"
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@21cfef2b496dd8ef5b904c159339626a10ad380e # v1.11.6
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Checkout master tools
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Terminus
        uses: ./.github/actions/terminus-setup
        with:
          pantheon-machine-token: ${{ secrets.TERMINUS_MACHINE_TOKEN }}

      - name: Collect State and Evaluate Gate
        id: gate
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          DEPLOY_WINDOW_VAR: ${{ vars.DEPLOY_WINDOW }}
          AUTO_DEPLOY_ENABLED_VAR: ${{ vars.AUTO_DEPLOY_ENABLED || 'false' }}
        run: |
          source .github/ci/pantheon.sh

          DEV_SHA=$(env_sha dev)
          TEST_SHA=$(env_sha test)
          LIVE_SHA=$(env_sha live)
          MASTER_SHA=$(git rev-parse HEAD)

          echo "Dev: ${DEV_SHA}"
          echo "Test: ${TEST_SHA}"
          echo "Live: ${LIVE_SHA}"
          echo "Master: ${MASTER_SHA}"

          # 1. Check window
          WINDOW_CONFIG='${{ vars.DEPLOY_WINDOW || "{\"days\":[1,2,3,4],\"start\":\"09:00\",\"end\":\"15:00\",\"tz\":\"America/Los_Angeles\"}" }}'
          WINDOW_RES=$(node .github/ci/deploy-window.mjs --window "${WINDOW_CONFIG}")
          IN_WINDOW=$(echo "${WINDOW_RES}" | jq -r .open)
          echo "In window: ${IN_WINDOW}"

          # 2. Check live precheck
          LIVE_CLEAN="true"
          if ! .github/ci/live-precheck.sh >/dev/null 2>&1; then
            LIVE_CLEAN="false"
          fi
          echo "Live clean: ${LIVE_CLEAN}"

          # 3. Check track record
          TRACK_RECORD=$(.github/ci/deployment-record.sh count-manual)
          echo "Manual track record: ${TRACK_RECORD}"

          # 4. Fetch commits between live and master
          python3 -c "
          import os, sys, urllib.request, json, subprocess

          token = os.environ['GH_TOKEN']
          repo = os.environ['REPO']
          live_sha = '${LIVE_SHA}'
          master_sha = '${MASTER_SHA}'
          dev_sha = '${DEV_SHA}'
          test_sha = '${TEST_SHA}'
          in_window = ('${IN_WINDOW}' == 'true')
          live_clean = ('${LIVE_CLEAN}' == 'true')
          auto_enabled = ('${AUTO_DEPLOY_ENABLED_VAR}' == 'true')
          track_record = int('${TRACK_RECORD}' or 0)

          headers = {
              'Authorization': f'token {token}',
              'Accept': 'application/vnd.github.v3+json',
              'User-Agent': 'civicactions-deploy-gate'
          }

          commits_list = []
          if live_sha and master_sha and live_sha != master_sha:
              compare_url = f'https://api.github.com/repos/{repo}/compare/{live_sha}...{master_sha}'
              try:
                  req = urllib.request.Request(compare_url, headers=headers)
                  with urllib.request.urlopen(req) as resp:
                      comp_data = json.loads(resp.read().decode())
                  for c in comp_data.get('commits', []):
                      c_sha = c['sha']
                      # Find associated PR
                      pr_url = f'https://api.github.com/repos/{repo}/commits/{c_sha}/pulls'
                      req_p = urllib.request.Request(pr_url, headers={'Authorization': f'token {token}', 'Accept': 'application/vnd.github.groot-preview+json'})
                      pr_num = None
                      pr_labels = []
                      try:
                          with urllib.request.urlopen(req_p) as resp_p:
                              prs = json.loads(resp_p.read().decode())
                              if prs:
                                  pr_num = prs[0]['number']
                                  pr_labels = [l['name'] for l in prs[0].get('labels', [])]
                      except Exception:
                          pass

                      commits_list.append({
                          'sha': c_sha,
                          'pr': pr_num,
                          'labels': pr_labels
                      })
              except Exception as e:
                  print(f'Note on commit comparison: {e}')

          state = {
              'live_sha': live_sha,
              'master_sha': master_sha,
              'dev_sha': dev_sha,
              'test_sha': test_sha,
              'commits': commits_list,
              'live_clean': live_clean,
              'in_window': in_window,
              'auto_deploy_enabled': auto_enabled,
              'manual_track_record': track_record
          }

          with open('gate-state.json', 'w') as f:
              json.dump(state, f, indent=2)

          eval_res = subprocess.run(['node', '.github/ci/evaluate-deploy-gate.mjs', '--state', json.dumps(state)], capture_output=True, text=True, check=True)
          eval_data = json.loads(eval_res.stdout)
          with open('gate-eval.json', 'w') as f:
              json.dump(eval_data, f, indent=2)

          print('Decision:', eval_data['decision'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"decision={eval_data['decision']}\n")
              out.write(f"target_sha={master_sha}\n")
          with open(os.environ['GITHUB_ENV'], 'a') as env_file:
              env_file.write(f"GATE_JSON<<EOF\n{json.dumps(eval_data)}\nEOF\n")
          "

      - name: Trigger Automated Deployment
        if: steps.gate.outputs.decision == 'deploy'
        uses: ./.github/workflows/deploy.yml
        with:
          trigger: "auto"
          expected_sha: ${{ steps.gate.outputs.target_sha }}
          gate_json: ${{ env.GATE_JSON || '{}' }}

      - name: Notify Blocked Auto-Deployment
        if: steps.gate.outputs.decision == 'blocked'
        run: |
          REASONS=$(jq -r '.reasons[]' gate-eval.json 2>/dev/null || echo "Unknown reasons")
          HAS_SECURITY_PR=$(jq -e '.commits[] | select(.labels[] == "deps:security-verified")' gate-state.json >/dev/null 2>&1 && echo "true" || echo "false")

          # Only alert if there is actually a pending security PR blocked from deploying
          if [[ "${HAS_SECURITY_PR}" == "true" ]]; then
            echo "Security commits are pending but blocked from automatic deployment:"
            echo "${REASONS}"

            gh api "repos/${{ github.repository }}/issues" \
              -f title="Automated Deployment Blocked for Pending Security Updates" \
              -f body="Automated live deployment was evaluated and blocked for the following reasons:\n\n${REASONS}\n\nTarget SHA: ${{ steps.gate.outputs.target_sha }}" \
              -f labels='["ci-alert:deploy-blocked"]' || true
          else
            echo "No pending security PRs to deploy. Gate evaluation complete without action."
          fi
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
