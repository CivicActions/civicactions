name: "Workflow Security & Linting"

on:
  pull_request:
    paths:
      - ".github/**"
  push:
    branches:
      - master
    paths:
      - ".github/**"

permissions:
  contents: read

jobs:
  actionlint:
    name: "actionlint"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run actionlint
        uses: reviewdog/action-actionlint@a7d35aaf8c309203a4ae861d32b7bd490baa7bf3 # v1.83.0
        with:
          fail_level: error

  zizmor:
    name: "zizmor"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@v0.8.1
        with:
          config: .github/zizmor.yml
          advanced-security: false
          annotations: true
