name: "PR Review Environment Checks"

run-name: review-env PR #${{ inputs.pr_number || github.event.issue.number }} @ ${{ github.event.client_payload.sha || 'verify' }}

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to verify and test"
        required: true
        type: string

concurrency:
  group: review-env-${{ inputs.pr_number || github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  verify-and-deploy:
    name: "Verify & Prepare Review Environment"
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.issue.pull_request &&
        github.event.comment.user.login == 'pantheon-site-integration[bot]' &&
        startsWith(github.event.comment.body, 'Successfully created multidev environment')
      )
    outputs:
      verified_sha: ${{ steps.prep.outputs.verified_sha }}
      env_name: ${{ steps.prep.outputs.env_name }}
      env_url: ${{ steps.prep.outputs.env_url }}
      pr_number: ${{ steps.prep.outputs.pr_number }}
      is_bot_pr: ${{ steps.prep.outputs.is_bot_pr }}
      should_run_tests: ${{ steps.prep.outputs.should_run_tests }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Checkout master tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terminus
        uses: ./.github/actions/terminus-setup
        with:
          pantheon-machine-token: ${{ secrets.TERMINUS_MACHINE_TOKEN }}
          pantheon-ssh-key: ${{ secrets.PANTHEON_SSH_KEY }}

      - name: Verify Environment and Run Pre-test Deploy
        id: prep
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.issue.number }}
          PANTHEON_SITE: ${{ vars.PANTHEON_SITE || 'civicactions' }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          source .github/ci/pantheon.sh

          ENV_NAME="pr-${PR_NUMBER}"
          echo "Processing review environment ${ENV_NAME} for PR #${PR_NUMBER}..."

          # 1. Resolve PR details
          PR_JSON=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}")
          VERIFIED_SHA=$(echo "${PR_JSON}" | jq -r .head.sha)
          AUTHOR_ASSOC=$(echo "${PR_JSON}" | jq -r .author_association)
          AUTHOR_LOGIN=$(echo "${PR_JSON}" | jq -r .user.login)
          LABELS=$(echo "${PR_JSON}" | jq -r '[.labels[].name] | join(",")')

          echo "VERIFIED_SHA: ${VERIFIED_SHA}"
          echo "Author: ${AUTHOR_LOGIN} (${AUTHOR_ASSOC})"

          # 2. Trust check
          if [[ "${EVENT_NAME}" == "issue_comment" ]]; then
            if [[ "${AUTHOR_LOGIN}" != "dependabot[bot]" &&                   "${AUTHOR_ASSOC}" != "OWNER" &&                   "${AUTHOR_ASSOC}" != "MEMBER" &&                   "${AUTHOR_ASSOC}" != "COLLABORATOR" ]]; then
              echo "Author ${AUTHOR_LOGIN} is external. Awaiting maintainer approval."
              gh api "repos/${REPO}/statuses/${VERIFIED_SHA}"                 -f state="pending"                 -f context="ci/review-env"                 -f description="Awaiting maintainer approval: run workflow_dispatch" >/dev/null
              echo "should_run_tests=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # 3. Check for refresh-content label
          if echo "${LABELS}" | tr ',' '\n' | grep -q "^refresh-content$"; then
            echo "Label refresh-content detected. Syncing content from dev..."
            terminus env:clone-content "${PANTHEON_SITE}.dev" "${ENV_NAME}" --yes
            gh api --method DELETE "repos/${REPO}/issues/${PR_NUMBER}/labels/refresh-content" || true
          fi

          # 4. Check deployed commit vs VERIFIED_SHA
          DEPLOYED_ID=$(deploy_id "${ENV_NAME}")
          echo "Deployed identifier on ${ENV_NAME}: ${DEPLOYED_ID}"
          if [[ -n "${DEPLOYED_ID}" ]] && ! sha_matches "${DEPLOYED_ID}" "${VERIFIED_SHA}"; then
            echo "Environment ${ENV_NAME} has ${DEPLOYED_ID}, not head ${VERIFIED_SHA:0:7}. Exiting without status change."
            echo "should_run_tests=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 5. Wait for workflows & verify HTTP 200
          wait_workflows "${ENV_NAME}" 600
          ENV_URL=$(env_url "${ENV_NAME}")
          echo "Pinging ${ENV_URL}..."
          curl -sSf -m 30 "${ENV_URL}" >/dev/null

          # 6. Set ci/review-env to pending (Running)
          gh api "repos/${REPO}/statuses/${VERIFIED_SHA}"             -f state="pending"             -f context="ci/review-env"             -f description="Running Drupal deploy & health checks" >/dev/null

          # 7. Drush deploy
          echo "Running drush deploy on ${ENV_NAME}..."
          drush "${ENV_NAME}" -- deploy -y

          # 8. Pre-test health check
          echo "Running pre-test health check..."
          .github/ci/health-check.sh "${ENV_NAME}" --phase pre

          is_bot_pr="false"
          if [[ "${AUTHOR_LOGIN}" == "dependabot[bot]" || "${LABELS}" == *"deps:"* ]]; then
            is_bot_pr="true"
          fi

          {
            echo "verified_sha=${VERIFIED_SHA}"
            echo "env_name=${ENV_NAME}"
            echo "env_url=${ENV_URL}"
            echo "pr_number=${PR_NUMBER}"
            echo "is_bot_pr=${is_bot_pr}"
            echo "should_run_tests=true"
          } >> "$GITHUB_OUTPUT"

  browser-tests:
    name: "Playwright Functional, A11y & Visual"
    runs-on: ubuntu-latest
    needs: [verify-and-deploy]
    if: needs.verify-and-deploy.outputs.should_run_tests == 'true'
    container:
      image: mcr.microsoft.com/playwright:v1.50.1-noble
    permissions:
      contents: read
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-and-deploy.outputs.verified_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install test dependencies (no cache)
        working-directory: tests/e2e
        run: npm ci

      - name: Run Functional & Accessibility Tests
        working-directory: tests/e2e
        env:
          BASE_URL: ${{ needs.verify-and-deploy.outputs.env_url }}
          REF_URL: "https://dev-${{ vars.PANTHEON_SITE || 'civicactions' }}.pantheonsite.io"
        run: |
          npx playwright test --grep "@functional|@a11y"

      - name: Capture Dev Reference Screenshots
        working-directory: tests/e2e
        env:
          BASE_URL: "https://dev-${{ vars.PANTHEON_SITE || 'civicactions' }}.pantheonsite.io"
        run: |
          npx playwright test --grep "@visual" --update-snapshots=all || true

      - name: Compare PR Screenshots against Dev Reference
        id: visual-compare
        working-directory: tests/e2e
        env:
          BASE_URL: ${{ needs.verify-and-deploy.outputs.env_url }}
        run: |
          npx playwright test --grep "@visual" || true

      - name: Upload Playwright Test Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report-pr-${{ needs.verify-and-deploy.outputs.pr_number }}
          path: tests/e2e/playwright-report
          retention-days: 14

      - name: Upload Test Results JSON
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-pr-${{ needs.verify-and-deploy.outputs.pr_number }}
          path: tests/e2e/test-results
          retention-days: 14

  post-test-verify:
    name: "Finalize Review Environment Results"
    runs-on: ubuntu-latest
    needs: [verify-and-deploy, browser-tests]
    if: always() && needs.verify-and-deploy.outputs.should_run_tests == 'true'
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Checkout master tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terminus
        uses: ./.github/actions/terminus-setup
        with:
          pantheon-machine-token: ${{ secrets.TERMINUS_MACHINE_TOKEN }}
          pantheon-ssh-key: ${{ secrets.PANTHEON_SSH_KEY }}

      - name: Download Test Results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-results-pr-${{ needs.verify-and-deploy.outputs.pr_number }}
          path: tests/e2e/test-results
        continue-on-error: true

      - name: Post-test Diagnostics & Reporting
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERIFIED_SHA: ${{ needs.verify-and-deploy.outputs.verified_sha }}
          ENV_NAME: ${{ needs.verify-and-deploy.outputs.env_name }}
          ENV_URL: ${{ needs.verify-and-deploy.outputs.env_url }}
          PR_NUMBER: ${{ needs.verify-and-deploy.outputs.pr_number }}
          IS_BOT_PR: ${{ needs.verify-and-deploy.outputs.is_bot_pr }}
          BROWSER_RESULT: ${{ needs.browser-tests.result }}
          PANTHEON_SITE: ${{ vars.PANTHEON_SITE || 'civicactions' }}
          REPO: ${{ github.repository }}
        run: |
          source .github/ci/pantheon.sh

          # 1. Post-test health check
          echo "Running post-test health check on ${ENV_NAME}..."
          .github/ci/health-check.sh "${ENV_NAME}" --phase post

          # 2. Check for missing page coverage warnings
          COVERAGE_WARNINGS=$(.github/ci/page-coverage.sh "${ENV_NAME}" 2>&1 || true)

          # 3. Check visual regression results
          node --input-type=module -e "
          import { parseVisualResults, formatVisualMarkdownTable } from './tests/e2e/lib/visual-summary.mjs';
          import fs from 'node:fs';

          const items = parseVisualResults('./tests/e2e/test-results/results.json');
          const table = formatVisualMarkdownTable(items);
          const hasDiff = items.some(i => i.status === 'diff' || i.status === 'reference_unavailable');

          fs.writeFileSync('visual-table.md', table);
          fs.writeFileSync('has-diff.txt', hasDiff ? 'true' : 'false');
          " || true

          HAS_DIFF=$(cat has-diff.txt 2>/dev/null || echo "false")
          VISUAL_TABLE=$(cat visual-table.md 2>/dev/null || echo "No visual summary available.")

          # 4. Check if final deployed commit matches VERIFIED_SHA
          FINAL_ID=$(deploy_id "${ENV_NAME}")
          if [[ -n "${FINAL_ID}" ]] && ! sha_matches "${FINAL_ID}" "${VERIFIED_SHA}"; then
            echo "Environment identifier changed from ${VERIFIED_SHA:0:7} to ${FINAL_ID} during testing. Discarding results."
            exit 0
          fi

          # 5. Determine overall review-env status
          FINAL_STATE="success"
          FINAL_DESC="All environment checks passed"

          if [[ "${BROWSER_RESULT}" != "success" ]]; then
            FINAL_STATE="failure"
            FINAL_DESC="Functional or accessibility tests failed"
          elif [[ "${IS_BOT_PR}" == "true" && "${HAS_DIFF}" == "true" ]]; then
            FINAL_STATE="failure"
            FINAL_DESC="Dependency bot PR has visual differences (blocking)"
          fi

          gh api "repos/${REPO}/statuses/${VERIFIED_SHA}"             -f state="${FINAL_STATE}"             -f context="ci/review-env"             -f description="${FINAL_DESC}" >/dev/null

          # 6. Build PR comment
          CREATED_AT=$(terminus env:info "${PANTHEON_SITE}.${ENV_NAME}" --field=created)
          COMMENT_BODY=$(printf "### Review Environment: [%s](%s)\n- **Deployed Commit**: \`%s\`\n- **Content Cloned At**: <t:%s:f>\n- **Functional & A11y Tests**: %s\n- **Drush Deploy & Health**: ✓ Passed\n\n#### Visual Comparison (Dev vs %s)\n%s\n\n%s" \
            "${ENV_NAME}" "${ENV_URL}" "${VERIFIED_SHA:0:7}" "${CREATED_AT}" "${BROWSER_RESULT}" "${ENV_NAME}" "${VISUAL_TABLE}" "${COVERAGE_WARNINGS}")

          {
            echo "COMMENT_BODY<<EOF"
            echo "${COMMENT_BODY}"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Upsert PR comment
        uses: ./.github/actions/pr-comment
        with:
          pr-number: ${{ needs.verify-and-deploy.outputs.pr_number }}
          marker: "<!-- ci:review-env -->"
          body: ${{ env.COMMENT_BODY }}
          github-token: ${{ steps.app-token.outputs.token }}

      - name: Update Gate Status
        uses: ./.github/actions/update-gate
        with:
          sha: ${{ needs.verify-and-deploy.outputs.verified_sha }}
          github-token: ${{ steps.app-token.outputs.token }}
