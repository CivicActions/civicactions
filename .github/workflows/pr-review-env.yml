name: "PR Review Environment Checks"

run-name: "review-env PR #${{ github.event.issue.number || inputs.pr_number }}"

# Runs when Pantheon comments that it built a PR's multidev, or when a PR
# command (/rerun-review-env, /refresh-content in review-env-commands.yml)
# dispatches it.
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number"
        required: true
        type: string
      refresh_content:
        description: "Copy dev's database and files to the environment first"
        type: boolean
        default: false

# Every PR comment starts this workflow. Only Pantheon's "Successfully created"
# comments and dispatches share the per-PR group; other comments get a
# run-scoped group so they can't cancel an in-progress review-env run.
concurrency:
  group: >-
    ${{ github.event_name == 'workflow_dispatch'
    && format('review-env-{0}', inputs.pr_number)
    || (github.event.comment.user.login == 'pantheon-site-integration[bot]'
    && startsWith(github.event.comment.body, 'Successfully created multidev environment')
    && format('review-env-{0}', github.event.issue.number))
    || format('review-env-ignored-{0}', github.run_id) }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: read
  pull-requests: write
  statuses: write

jobs:
  verify-and-deploy:
    name: "Verify & Prepare Review Environment"
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' || (
        github.event.issue.pull_request &&
        github.event.comment.user.login == 'pantheon-site-integration[bot]' &&
        startsWith(github.event.comment.body, 'Successfully created multidev environment')
      )
    outputs:
      verified_sha: ${{ steps.prep.outputs.verified_sha }}
      env_name: ${{ steps.prep.outputs.env_name }}
      env_url: ${{ steps.prep.outputs.env_url }}
      pr_number: ${{ steps.prep.outputs.pr_number }}
      content_at: ${{ steps.prep.outputs.content_at }}
      content_stale: ${{ steps.prep.outputs.content_stale }}
      content_note: ${{ steps.prep.outputs.content_note }}
      should_run_tests: ${{ steps.prep.outputs.should_run_tests }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Checkout master tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terminus
        uses: ./.github/actions/terminus-setup
        with:
          pantheon-machine-token: ${{ secrets.TERMINUS_MACHINE_TOKEN }}
          pantheon-ssh-key: ${{ secrets.PANTHEON_SSH_KEY }}
          # grugnog/terminus-config-export civicactions-main
          # TODO: This can be moved to an upstream commit when PRs are merged.
          config-export-plugin-ref: fd9ca8aee996e0eea4d443a9f24b6f66892e994e

      - name: Verify Environment and Run Pre-test Deploy
        id: prep
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          DEPLOYMENTS_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number || inputs.pr_number }}
          REFRESH_CONTENT: ${{ inputs.refresh_content }}
          PANTHEON_SITE: ${{ vars.PANTHEON_SITE || 'civicactions' }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          source .github/ci/pantheon.sh

          if [[ ! "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid PR number: ${PR_NUMBER}"
            exit 1
          fi
          ENV_NAME="pr-${PR_NUMBER}"
          echo "Processing review environment ${ENV_NAME} for PR #${PR_NUMBER} (${EVENT_NAME})..."

          # 1. Resolve PR details
          PR_JSON=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}")
          if [[ "$(echo "${PR_JSON}" | jq -r .state)" != "open" ]]; then
            echo "PR #${PR_NUMBER} is not open; nothing to check."
            echo "should_run_tests=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERIFIED_SHA=$(echo "${PR_JSON}" | jq -r .head.sha)
          AUTHOR_ASSOC=$(echo "${PR_JSON}" | jq -r .author_association)
          AUTHOR_LOGIN=$(echo "${PR_JSON}" | jq -r .user.login)
          LABELS=$(echo "${PR_JSON}" | jq -r '[.labels[].name] | join(",")')

          echo "VERIFIED_SHA: ${VERIFIED_SHA}"
          echo "Author: ${AUTHOR_LOGIN} (${AUTHOR_ASSOC})"

          # Emitted early so the failure handler can report against this SHA
          {
            echo "verified_sha=${VERIFIED_SHA}"
            echo "stage=waiting for Pantheon environment"
          } >> "$GITHUB_OUTPUT"

          # 2. Trust check. Dispatches come from PR commands, which require
          # write access, so a maintainer has asked for this run.
          if [[ "${EVENT_NAME}" == "issue_comment" ]]; then
            if [[ "${AUTHOR_LOGIN}" != "dependabot[bot]" &&                   "${AUTHOR_ASSOC}" != "OWNER" &&                   "${AUTHOR_ASSOC}" != "MEMBER" &&                   "${AUTHOR_ASSOC}" != "COLLABORATOR" ]]; then
              echo "Author ${AUTHOR_LOGIN} is external. Review environment tests are not run."
              gh api "repos/${REPO}/statuses/${VERIFIED_SHA}"                 -f state="pending"                 -f context="ci/review-env"                 -f description="External author: a maintainer can comment /rerun-review-env to run the checks" >/dev/null
              echo "should_run_tests=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # 3. Confirm Pantheon finished deploying the PR head. Pantheon's GitHub
          # app records a deployment per build with the exact commit;
          # PANTHEON_DEPLOYMENT_IDENTIFIER is unreliable on new multidevs.
          echo "stage=checking Pantheon deployment" >> "$GITHUB_OUTPUT"
          for attempt in 1 2 3 4 5 6; do
            DEPLOYMENT=$(latest_deployment "${ENV_NAME}")
            read -r DEPLOYED_SHA DEPLOY_STATE <<< "${DEPLOYMENT}" || true
            echo "Latest ${ENV_NAME} deployment: ${DEPLOYED_SHA:-none} (${DEPLOY_STATE:-none})"
            # Statuses can lag the bot comment slightly.
            [[ "${DEPLOYED_SHA:-}" == "${VERIFIED_SHA}" && "${DEPLOY_STATE}" =~ ^(pending|queued|in_progress)$ && "${attempt}" -lt 6 ]] || break
            sleep 10
          done
          if [[ "${DEPLOYED_SHA:-}" != "${VERIFIED_SHA}" || "${DEPLOY_STATE}" != "success" ]]; then
            if [[ "${DEPLOYED_SHA:-}" == "${VERIFIED_SHA}" && "${DEPLOY_STATE}" =~ ^(failure|error)$ ]]; then
              echo "::error::Pantheon reported a failed deployment of ${VERIFIED_SHA:0:7} to ${ENV_NAME}."
              exit 1
            fi
            echo "Pantheon has not finished deploying head ${VERIFIED_SHA:0:7} to ${ENV_NAME}; its next comment re-runs this check."
            gh api "repos/${REPO}/statuses/${VERIFIED_SHA}"                 -f state="pending"                 -f context="ci/review-env"                 -f description="Waiting for Pantheon to deploy ${VERIFIED_SHA:0:7} (latest: ${DEPLOYED_SHA:0:7} ${DEPLOY_STATE:-none})" >/dev/null
            echo "should_run_tests=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 4. Wait for workflows & verify HTTP 200
          wait_workflows "${ENV_NAME}"
          ENV_URL=$(env_url "${ENV_NAME}")
          echo "Pinging ${ENV_URL}..."
          curl -sSf -m 30 "${ENV_URL}" >/dev/null

          # 5. /refresh-content: copy dev's database and files before testing.
          if [[ "${REFRESH_CONTENT}" == "true" ]]; then
            echo "stage=refreshing content from dev" >> "$GITHUB_OUTPUT"
            echo "Copying content from dev to ${ENV_NAME} (/refresh-content)..."
            terminus env:clone-content "${PANTHEON_SITE}.dev" "${ENV_NAME}" --yes
          fi

          is_bot_pr="false"
          if [[ "${AUTHOR_LOGIN}" == "dependabot[bot]" || "${LABELS}" == *"deps:"* ]]; then
            is_bot_pr="true"
          fi

          # 5b. Visual comparisons use dev as the reference, so content copied
          # before dev's database was last replaced makes differences
          # meaningless. Re-copy automatically on bot PRs; on other PRs,
          # reviewers may have entered content here, so warn instead.
          DEV_DB_AT=$(last_db_clone_at dev)
          CONTENT_AT=$(terminus env:info "${PANTHEON_SITE}.${ENV_NAME}" --field=created 2>/dev/null | cut -d. -f1)
          CONTENT_AT=${CONTENT_AT:-0}
          ENV_CLONE_AT=$(last_db_clone_at "${ENV_NAME}")
          if (( ENV_CLONE_AT > CONTENT_AT )); then
            CONTENT_AT=${ENV_CLONE_AT}
          fi
          CONTENT_NOTE=""
          CONTENT_STALE="false"
          if (( DEV_DB_AT > CONTENT_AT )); then
            if [[ "${is_bot_pr}" == "true" ]]; then
              echo "Dev's database was replaced after ${ENV_NAME}'s content was copied. Re-copying content from dev..."
              echo "stage=refreshing content from dev" >> "$GITHUB_OUTPUT"
              terminus env:clone-content "${PANTHEON_SITE}.dev" "${ENV_NAME}" --yes
              CONTENT_AT=$(date +%s)
            else
              echo "::warning::${ENV_NAME} content predates dev's last database replacement; visual differences may come from content."
              CONTENT_STALE="true"
              # shellcheck disable=SC2016 # Markdown backticks, not command substitution.
              CONTENT_NOTE='> [!WARNING]
          > The content on this environment was copied before the dev database was last replaced, so visual differences may come from content rather than code. Comment `/refresh-content` to copy the current dev content and re-run the checks (this overwrites content entered on this environment), or `/approve-visual` if you have checked the differences.'
            fi
          fi

          # 5c. Pantheon's content copy can silently drop uploaded files, which
          # shows up as visual differences on every page. Re-copy files only
          # (safe: the database is untouched) and fail if that doesn't help.
          echo "stage=checking uploaded files" >> "$GITHUB_OUTPUT"
          ENV_MISSING=$(missing_files "${ENV_NAME}")
          DEV_MISSING=$(missing_files dev)
          if (( ENV_MISSING > DEV_MISSING )); then
            echo "${ENV_NAME} is missing ${ENV_MISSING} uploaded files (dev: ${DEV_MISSING}). Re-copying files from dev..."
            terminus env:clone-content "${PANTHEON_SITE}.dev" "${ENV_NAME}" --files-only --yes
            ENV_MISSING=$(missing_files "${ENV_NAME}")
            if (( ENV_MISSING > DEV_MISSING )); then
              echo "::error::${ENV_NAME} is still missing ${ENV_MISSING} uploaded files (dev: ${DEV_MISSING}) after re-copying files. Comment /recreate-review-env to rebuild it."
              echo "stage=file check (${ENV_MISSING} files missing; comment /recreate-review-env)" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          fi
          echo "Uploaded files OK on ${ENV_NAME} (missing: ${ENV_MISSING}, dev: ${DEV_MISSING})."

          # 6. Set ci/review-env and ci/visual to pending (Running); a re-run
          # replaces earlier results for this commit.
          gh api "repos/${REPO}/statuses/${VERIFIED_SHA}"             -f state="pending"             -f context="ci/review-env"             -f description="Running Drupal deploy & health checks" >/dev/null
          gh api "repos/${REPO}/statuses/${VERIFIED_SHA}" -f state="pending" -f context="ci/visual" \
            -f description="Waiting for visual comparison" >/dev/null
          node .github/actions/update-gate/gate.mjs "${VERIFIED_SHA}"

          # 7. Drush deploy
          echo "stage=drush deploy" >> "$GITHUB_OUTPUT"
          echo "Running drush deploy on ${ENV_NAME}..."
          drush "${ENV_NAME}" -- deploy

          # 8. Commit configuration that module updates changed. Config that
          # still differs after drush deploy's import is what the updated code
          # writes, so it belongs in git. See docs/plans/dependency-config-sync.md.
          echo "stage=config sync" >> "$GITHUB_OUTPUT"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          HEAD_REPO=$(echo "${PR_JSON}" | jq -r .head.repo.full_name)
          HEAD_REF=$(echo "${PR_JSON}" | jq -r .head.ref)
          PR_FILES=$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files" --jq '.[].filename')
          HEAD_MESSAGE=$(gh api "repos/${REPO}/commits/${VERIFIED_SHA}" --jq .commit.message)

          # Fails the run, listing config that exporting and committing cannot
          # fix (usually a module bug), so the sync never commits in a loop.
          fail_round_trip() {
            echo "::error::Configuration still differs after its export was committed, so it does not round-trip. The config sync will not commit again."
            gh pr comment "${PR_NUMBER}" -R "${REPO}" --body "$(printf '%s\n' \
              '### Configuration does not round-trip' \
              '' \
              "This configuration still differs on \`${ENV_NAME}\` after \`drush deploy\`, and exporting and committing it cannot fix that, so the config sync stopped:" \
              '' \
              "$1" \
              '' \
              'This is usually a module bug. Fix it or update the configuration by hand, then push a new commit.' \
              '' \
              "[Workflow run](${RUN_URL})")"
            exit 1
          }

          SYNC_SKIP=""
          if [[ "${HEAD_REPO}" != "${REPO}" ]]; then
            SYNC_SKIP="the pull request is from a fork"
          elif ! grep -qxE 'composer\.(json|lock)' <<< "${PR_FILES}"; then
            SYNC_SKIP="the pull request does not change composer.json or composer.lock"
          elif node .github/ci/config-sync.mjs is-sync-commit <<< "${HEAD_MESSAGE}"; then
            drush "${ENV_NAME}" -- config:status --format=json > "${RUNNER_TEMP}/config-status.json"
            STILL_DRIFTED=$(node .github/ci/config-sync.mjs drift --status "${RUNNER_TEMP}/config-status.json")
            if [[ -n "${STILL_DRIFTED}" ]]; then
              STILL_LIST=""
              while IFS= read -r name; do
                STILL_LIST+="- \`${name}\`"$'\n'
              done <<< "${STILL_DRIFTED}"
              fail_round_trip "${STILL_LIST}"
            fi
            SYNC_SKIP="the head commit is a config sync commit and nothing differs"
          fi

          if [[ -n "${SYNC_SKIP}" ]]; then
            echo "Skipping config sync: ${SYNC_SKIP}."
          else
            # Only YAML files are copied into this checkout and committed; no
            # code from the pull request runs.
            SYNC_DIR="${RUNNER_TEMP}/pr-head"
            git init -q "${SYNC_DIR}"
            git -C "${SYNC_DIR}" config http.https://github.com/.extraheader \
              "AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
            git -C "${SYNC_DIR}" fetch -q --depth 1 "https://github.com/${REPO}.git" "${VERIFIED_SHA}"
            git -C "${SYNC_DIR}" checkout -q FETCH_HEAD

            SYNC_STATUS=0
            .github/ci/sync-config-drift.sh "${ENV_NAME}" "${SYNC_DIR}/config" "${RUNNER_TEMP}/config-sync.json" || SYNC_STATUS=$?
            if [[ "${SYNC_STATUS}" -eq 3 ]]; then
              fail_round_trip "$(jq -r '.drift[] | "- `\(.name)` (\(.state))"' "${RUNNER_TEMP}/config-sync.json")"
            elif [[ "${SYNC_STATUS}" -ne 0 ]]; then
              exit "${SYNC_STATUS}"
            fi

            CHANGED=$(jq -r '.changed[] | "- `\(.name)` (\(.state))"' "${RUNNER_TEMP}/config-sync.json")
            if [[ -n "${CHANGED}" ]]; then
              BOT_LOGIN="${APP_SLUG}[bot]"
              BOT_ID=$(gh api "users/${BOT_LOGIN}" --jq .id)
              git -C "${SYNC_DIR}" add -A config
              git -C "${SYNC_DIR}" -c user.name="${BOT_LOGIN}" \
                -c user.email="${BOT_ID}+${BOT_LOGIN}@users.noreply.github.com" \
                commit -q \
                -m "chore(config): sync config after dependency update" \
                -m "Configuration that still differed on ${ENV_NAME} after drush deploy, exported with drush cex:" \
                -m "${CHANGED}" \
                -m "Config-Sync: ${RUN_URL}"
              # Not forced: if the branch moved since this run started, the push
              # is rejected and the newer commit gets its own run.
              git -C "${SYNC_DIR}" push -q "https://github.com/${REPO}.git" "HEAD:refs/heads/${HEAD_REF}"
              NEW_SHA=$(git -C "${SYNC_DIR}" rev-parse HEAD)
              echo "Committed configuration changes as ${NEW_SHA:0:7}."

              gh pr comment "${PR_NUMBER}" -R "${REPO}" --body "$(printf '%s\n' \
                '### Configuration synced' \
                '' \
                "This configuration still differed on \`${ENV_NAME}\` after \`drush deploy\`. It was exported with \`drush cex\` and committed in ${NEW_SHA}:" \
                '' \
                "${CHANGED}" \
                '' \
                'Please review the changes. The review environment checks run again once Pantheon has deployed the new commit.' \
                '' \
                "[Workflow run](${RUN_URL})")"
              gh api "repos/${REPO}/statuses/${VERIFIED_SHA}" \
                -f state="pending" \
                -f context="ci/review-env" \
                -f description="Config changes committed in ${NEW_SHA:0:7}; checks run on that commit" >/dev/null
              echo "should_run_tests=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # 9. Pre-test health check
          echo "stage=pre-test health check" >> "$GITHUB_OUTPUT"
          echo "Running pre-test health check..."
          .github/ci/health-check.sh "${ENV_NAME}" --phase pre

          {
            echo "verified_sha=${VERIFIED_SHA}"
            echo "env_name=${ENV_NAME}"
            echo "env_url=${ENV_URL}"
            echo "pr_number=${PR_NUMBER}"
            echo "content_at=${CONTENT_AT}"
            echo "content_stale=${CONTENT_STALE}"
            echo "content_note<<CONTENT_NOTE_EOF"
            echo "${CONTENT_NOTE}"
            echo "CONTENT_NOTE_EOF"
            echo "should_run_tests=true"
          } >> "$GITHUB_OUTPUT"

      - name: Report review-env failure
        if: failure() && steps.prep.outputs.verified_sha != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERIFIED_SHA: ${{ steps.prep.outputs.verified_sha }}
          STAGE: ${{ steps.prep.outputs.stage }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/${REPO}/statuses/${VERIFIED_SHA}" \
            -f state="failure" \
            -f context="ci/review-env" \
            -f description="Failed during ${STAGE}" \
            -f target_url="${RUN_URL}" >/dev/null

      - name: Update Gate Status on failure
        if: failure() && steps.prep.outputs.verified_sha != ''
        uses: ./.github/actions/update-gate
        with:
          sha: ${{ steps.prep.outputs.verified_sha }}
          github-token: ${{ steps.app-token.outputs.token }}

  browser-tests:
    name: "Playwright Functional, A11y & Visual"
    runs-on: ubuntu-latest
    needs: [verify-and-deploy]
    if: needs.verify-and-deploy.outputs.should_run_tests == 'true'
    container:
      image: mcr.microsoft.com/playwright:v1.50.1-noble
    permissions:
      contents: read
    steps:
      # Runs master's script before any PR code is checked out, so the machine
      # token is only ever in this step's environment. PR code sees only the
      # masked bypass token exported to GITHUB_ENV.
      - name: Checkout master CI scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .ci-trusted
          persist-credentials: false
          sparse-checkout: .github/ci/pantheon-bot-bypass.mjs
          sparse-checkout-cone-mode: false

      - name: Get Pantheon bot bypass token
        env:
          TERMINUS_MACHINE_TOKEN: ${{ secrets.TERMINUS_MACHINE_TOKEN }}
          PANTHEON_SITE: ${{ vars.PANTHEON_SITE || 'civicactions' }}
        run: node .ci-trusted/.github/ci/pantheon-bot-bypass.mjs

      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-and-deploy.outputs.verified_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install test dependencies (no cache for untrusted PR code)
        working-directory: tests/e2e
        run: npm ci

      # The container image only ships browsers for its own Playwright version;
      # install the build matching package-lock.json so Dependabot bumps work.
      - name: Install Playwright browser
        working-directory: tests/e2e
        run: npx playwright install chromium

      - name: Run Functional & Accessibility Tests
        working-directory: tests/e2e
        env:
          BASE_URL: ${{ needs.verify-and-deploy.outputs.env_url }}
          REF_URL: "https://dev-${{ vars.PANTHEON_SITE || 'civicactions' }}.pantheonsite.io"
        run: |
          npx playwright test --grep "@functional|@a11y"

      - name: Capture Dev Reference Screenshots
        if: ${{ !cancelled() }}
        working-directory: tests/e2e
        env:
          BASE_URL: "https://dev-${{ vars.PANTHEON_SITE || 'civicactions' }}.pantheonsite.io"
        run: |
          npx playwright test --grep "@visual" --update-snapshots=all || true

      - name: Compare PR Screenshots against Dev Reference
        if: ${{ !cancelled() }}
        id: visual-compare
        working-directory: tests/e2e
        env:
          BASE_URL: ${{ needs.verify-and-deploy.outputs.env_url }}
        run: |
          npx playwright test --grep "@visual" || true

      - name: Upload Playwright Test Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report-pr-${{ needs.verify-and-deploy.outputs.pr_number }}
          path: tests/e2e/playwright-report
          retention-days: 14

      - name: Upload Test Results JSON
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-pr-${{ needs.verify-and-deploy.outputs.pr_number }}
          path: tests/e2e/test-results
          retention-days: 14

  post-test-verify:
    name: "Finalize Review Environment Results"
    runs-on: ubuntu-latest
    needs: [verify-and-deploy, browser-tests]
    if: always() && needs.verify-and-deploy.outputs.should_run_tests == 'true'
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Checkout master tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terminus
        uses: ./.github/actions/terminus-setup
        with:
          pantheon-machine-token: ${{ secrets.TERMINUS_MACHINE_TOKEN }}
          pantheon-ssh-key: ${{ secrets.PANTHEON_SSH_KEY }}

      - name: Download Test Results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-results-pr-${{ needs.verify-and-deploy.outputs.pr_number }}
          path: tests/e2e/test-results
        continue-on-error: true

      - name: Install CI script dependencies
        run: npm ci --prefix .github/ci
        continue-on-error: true

      # Runs in a JavaScript action because artifact uploads need the Actions
      # runtime token, which plain run steps don't receive.
      - name: Upload visual difference images
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ needs.verify-and-deploy.outputs.pr_number }}
        with:
          script: |
            const { run } = await import(`${process.env.GITHUB_WORKSPACE}/.github/ci/vrt-diff-links.mjs`);
            await run();
        continue-on-error: true

      - name: Post-test Diagnostics & Reporting
        id: report
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          DEPLOYMENTS_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ needs.verify-and-deploy.outputs.verified_sha }}
          ENV_NAME: ${{ needs.verify-and-deploy.outputs.env_name }}
          ENV_URL: ${{ needs.verify-and-deploy.outputs.env_url }}
          PR_NUMBER: ${{ needs.verify-and-deploy.outputs.pr_number }}
          BROWSER_RESULT: ${{ needs.browser-tests.result }}
          CONTENT_AT: ${{ needs.verify-and-deploy.outputs.content_at }}
          CONTENT_STALE: ${{ needs.verify-and-deploy.outputs.content_stale }}
          CONTENT_NOTE: ${{ needs.verify-and-deploy.outputs.content_note }}
          PANTHEON_SITE: ${{ vars.PANTHEON_SITE || 'civicactions' }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          source .github/ci/pantheon.sh

          # 1. Post-test health check
          echo "Running post-test health check on ${ENV_NAME}..."
          .github/ci/health-check.sh "${ENV_NAME}" --phase post

          # 2. Check for missing page coverage warnings
          COVERAGE_WARNINGS=$(.github/ci/page-coverage.sh "${ENV_NAME}" || true)

          # 3. Visual comparison table
          node --input-type=module -e "
          import { parseVisualResults, formatVisualMarkdownTable } from './tests/e2e/lib/visual-summary.mjs';
          import fs from 'node:fs';

          const items = parseVisualResults('./tests/e2e/test-results/results.json');
          const links = fs.existsSync('vrt-links.json') ? JSON.parse(fs.readFileSync('vrt-links.json', 'utf8')) : {};
          let table = formatVisualMarkdownTable(items, links);
          if (Object.keys(links).length > 0) {
            table += '\n_Difference links open a side-by-side image: dev reference, this environment, highlighted changes. GitHub sign-in required; kept for 14 days._\n';
          }
          fs.writeFileSync('visual-table.md', table);
          " || true
          VISUAL_TABLE=$(cat visual-table.md 2>/dev/null || echo "No visual summary available.")

          # 4. Discard results if Pantheon deployed a newer commit during testing
          FINAL_DEPLOYMENT=$(latest_deployment "${ENV_NAME}")
          FINAL_SHA="${FINAL_DEPLOYMENT%% *}"
          if [[ -n "${FINAL_SHA}" && "${FINAL_SHA}" != "${VERIFIED_SHA}" ]]; then
            echo "Pantheon deployed ${FINAL_SHA:0:7} to ${ENV_NAME} during testing of ${VERIFIED_SHA:0:7}. Discarding results."
            exit 0
          fi

          # 5. ci/review-env: deploy, health, functional and accessibility checks
          if [[ "${BROWSER_RESULT}" == "success" ]]; then
            REVIEW_STATE="success"
            REVIEW_DESC="All environment checks passed"
          else
            REVIEW_STATE="failure"
            REVIEW_DESC="Functional or accessibility tests failed"
          fi
          gh api "repos/${REPO}/statuses/${VERIFIED_SHA}" -f state="${REVIEW_STATE}" -f context="ci/review-env" \
            -f description="${REVIEW_DESC}" -f target_url="${RUN_URL}" >/dev/null

          # 6. ci/visual: differences block merging until someone approves them
          # for this code (/approve-visual). Approvals are keyed to the git
          # tree, so commits that change no files keep them.
          TREE=$(gh api "repos/${REPO}/commits/${VERIFIED_SHA}" -q .commit.tree.sha)
          APPROVAL=$(gh api --paginate --slurp "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            | node .github/ci/visual-status.mjs find-approval --tree "${TREE}" --bot "${APP_SLUG}[bot]")
          DECIDE_ARGS=(decide --results ./tests/e2e/test-results/results.json)
          [[ -n "${APPROVAL}" ]] && DECIDE_ARGS+=(--approval "${APPROVAL}")
          [[ "${CONTENT_STALE}" == "true" ]] && DECIDE_ARGS+=(--content-stale)
          VISUAL=$(node .github/ci/visual-status.mjs "${DECIDE_ARGS[@]}")
          VISUAL_STATE=$(jq -r .state <<< "${VISUAL}")
          VISUAL_DESC=$(jq -r .description <<< "${VISUAL}")
          gh api "repos/${REPO}/statuses/${VERIFIED_SHA}" -f state="${VISUAL_STATE}" -f context="ci/visual" \
            -f description="${VISUAL_DESC}" -f target_url="${RUN_URL}" >/dev/null
          echo "ci/review-env: ${REVIEW_STATE} (${REVIEW_DESC}); ci/visual: ${VISUAL_STATE} (${VISUAL_DESC})"
          echo "reported=true" >> "$GITHUB_OUTPUT"

          # 7. Build PR comment
          case "${VISUAL_STATE}" in
            success) VISUAL_ICON="✅" ;;
            failure) VISUAL_ICON="⚠️" ;;
            *) VISUAL_ICON="❌" ;;
          esac
          # shellcheck disable=SC2016 # Markdown backticks, not command substitution.
          COMMANDS='<details><summary>Review environment commands</summary>

          Comment one of these on this pull request (write access required):

          | Command | What it does |
          |---|---|
          | `/approve-visual [reason]` | Accepts the visual differences for this code. A code change resets the approval. |
          | `/refresh-content` | Copies the dev database and files to this environment, then re-runs the checks. Overwrites content entered here. |
          | `/rerun-review-env` | Re-runs the checks without changing anything. |
          | `/recreate-review-env` | Deletes and rebuilds this environment from dev, then re-runs the checks. |

          </details>'
          CONTENT_DATE=$(date -u -d "@${CONTENT_AT:-0}" '+%Y-%m-%d %H:%M UTC')
          COMMENT_BODY=$(printf "### Review Environment: [%s](%s)\n- **Deployed Commit**: \`%s\`\n- **Content Copied From Dev**: %s\n- **Drush Deploy & Health**: ✓ Passed\n- **Functional & A11y Tests**: %s\n- **Visual Comparison**: %s %s\n\n%s\n\n#### Visual Comparison (Dev vs %s)\n%s\n\n%s\n\n%s" \
            "${ENV_NAME}" "${ENV_URL}" "${VERIFIED_SHA:0:7}" "${CONTENT_DATE}" "${BROWSER_RESULT}" "${VISUAL_ICON}" "${VISUAL_DESC}" "${CONTENT_NOTE}" "${ENV_NAME}" "${VISUAL_TABLE}" "${COVERAGE_WARNINGS}" "${COMMANDS}")

          {
            echo "COMMENT_BODY<<EOF"
            echo "${COMMENT_BODY}"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Upsert PR comment
        if: steps.report.outputs.reported == 'true'
        uses: ./.github/actions/pr-comment
        with:
          pr-number: ${{ needs.verify-and-deploy.outputs.pr_number }}
          marker: "<!-- ci:review-env -->"
          body: ${{ env.COMMENT_BODY }}
          github-token: ${{ steps.app-token.outputs.token }}

      # A health check or reporting failure would otherwise leave the statuses
      # pending until the sweeper times them out.
      - name: Report finalize failure
        if: failure() && steps.report.outputs.reported != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERIFIED_SHA: ${{ needs.verify-and-deploy.outputs.verified_sha }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for context in ci/review-env ci/visual; do
            gh api "repos/${REPO}/statuses/${VERIFIED_SHA}" -f state="error" -f context="${context}" \
              -f description="Post-test checks failed: see the run, then comment /rerun-review-env" \
              -f target_url="${RUN_URL}" >/dev/null
          done

      - name: Update Gate Status
        if: always() && (steps.report.outputs.reported == 'true' || failure())
        uses: ./.github/actions/update-gate
        with:
          sha: ${{ needs.verify-and-deploy.outputs.verified_sha }}
          github-token: ${{ steps.app-token.outputs.token }}
