name: "Review Environment Sweeper"

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  statuses: write
  pull-requests: read

jobs:
  sweep-pending:
    name: "Sweep Expired Pending Review Environments"
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Checkout repository for composite actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/actions/update-gate

      - name: Sweep expired pending environments
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TIMEOUT_MINUTES: ${{ vars.REVIEW_ENV_TIMEOUT_MINUTES || '45' }}
          REPO: ${{ github.repository }}
        run: |
          python3 -c "
          import os, sys, subprocess, urllib.request, json, datetime

          token = os.environ['GH_TOKEN']
          repo = os.environ['REPO']
          timeout_mins = int(os.environ.get('TIMEOUT_MINUTES', 45))
          now = datetime.datetime.now(datetime.timezone.utc)

          headers = {
              'Authorization': f'token {token}',
              'Accept': 'application/vnd.github.v3+json',
              'User-Agent': 'civicactions-sweeper'
          }

          # 1. Fetch open PRs
          prs_url = f'https://api.github.com/repos/{repo}/pulls?state=open&per_page=100'
          req = urllib.request.Request(prs_url, headers=headers)
          with urllib.request.urlopen(req) as resp:
              prs = json.loads(resp.read().decode())

          for pr in prs:
              pr_num = pr['number']
              head_sha = pr['head']['sha']

              # Fetch commit status
              status_url = f'https://api.github.com/repos/{repo}/commits/{head_sha}/status'
              req_s = urllib.request.Request(status_url, headers=headers)
              with urllib.request.urlopen(req_s) as resp_s:
                  data = json.loads(resp_s.read().decode())

              # Statuses that never finished: the environment never came up,
              # or a run died before reporting.
              expired = {
                  'ci/review-env': f'Environment unavailable after {timeout_mins}m: comment /recreate-review-env or /rerun-review-env',
                  'ci/visual': f'No visual results after {timeout_mins}m: comment /rerun-review-env',
              }
              swept = False
              for s in data.get('statuses', []):
                  context = s['context']
                  if context in expired and s['state'] == 'pending':
                      created_at = datetime.datetime.fromisoformat(s['created_at'].replace('Z', '+00:00'))
                      age_mins = (now - created_at).total_seconds() / 60.0
                      if age_mins > timeout_mins:
                          print(f'PR #{pr_num} {head_sha[:8]} {context} has been pending for {age_mins:.1f}m > {timeout_mins}m. Marking error.')
                          post_url = f'https://api.github.com/repos/{repo}/statuses/{head_sha}'
                          post_data = json.dumps({
                              'state': 'error',
                              'context': context,
                              'description': expired[context],
                          }).encode('utf-8')
                          urllib.request.urlopen(urllib.request.Request(post_url, data=post_data, headers=headers))
                          swept = True

              if swept:
                  result = subprocess.run(['node', '.github/actions/update-gate/gate.mjs', head_sha])
                  if result.returncode != 0:
                      print(f'Could not update ci/gate for {head_sha[:8]}')
          "
