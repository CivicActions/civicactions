name: "Master Dev Sync & Verify"

on:
  push:
    branches:
      - master

concurrency:
  group: pantheon-deploy
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  deployments: read

jobs:
  sync-dev:
    name: "Sync & Verify Dev Environment"
    runs-on: ubuntu-latest
    outputs:
      superseded: ${{ steps.wait-dev.outputs.superseded }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Checkout master tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terminus
        uses: ./.github/actions/terminus-setup
        with:
          pantheon-machine-token: ${{ secrets.TERMINUS_MACHINE_TOKEN }}
          pantheon-ssh-key: ${{ secrets.PANTHEON_SSH_KEY }}

      - name: Wait for Dev to Deploy Master Commit
        id: wait-dev
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          PANTHEON_SITE: ${{ vars.PANTHEON_SITE || 'civicactions' }}
          REPO: ${{ github.repository }}
        run: |
          source .github/ci/pantheon.sh

          echo "Waiting for dev on ${PANTHEON_SITE} to match master ${HEAD_SHA} (timeout 45m)..."
          start_time=$(date +%s)
          timeout=2700

          while true; do
            DEV_SHA=$(env_sha dev)
            echo "Current dev SHA: ${DEV_SHA}"

            if sha_matches "${DEV_SHA}" "${HEAD_SHA}" || sha_matches "${HEAD_SHA:0:7}" "${DEV_SHA}"; then
              echo "Dev environment is running pushed commit ${HEAD_SHA:0:7}."
              break
            fi

            # Pantheon builds only the newest commit when pushes land close
            # together, so dev may never show this one. The newer push's run
            # (queued on the pantheon-deploy lock) verifies dev instead.
            MASTER_SHA=$(gh api "repos/${REPO}/commits/master" -q .sha 2>/dev/null || true)
            if [[ -n "${MASTER_SHA}" && "${MASTER_SHA}" != "${HEAD_SHA}" ]]; then
              echo "master has moved on to ${MASTER_SHA:0:7}; its run verifies dev. Skipping ${HEAD_SHA:0:7}."
              echo "superseded=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            current_time=$(date +%s)
            if (( current_time - start_time > timeout )); then
              echo "Timed out waiting for dev to deploy ${HEAD_SHA}." >&2
              exit 1
            fi

            sleep 15
          done

          # Dev code syncs have taken up to 40 minutes.
          wait_workflows dev 3600
          echo "Running drush deploy on dev..."
          drush dev -- deploy

          echo "Running post-deploy health diagnostics on dev..."
          .github/ci/health-check.sh dev --phase post

      - name: Setup Node.js for smoke tests
        if: steps.wait-dev.outputs.superseded != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Get Pantheon bot bypass token
        if: steps.wait-dev.outputs.superseded != 'true'
        env:
          TERMINUS_MACHINE_TOKEN: ${{ secrets.TERMINUS_MACHINE_TOKEN }}
          PANTHEON_SITE: ${{ vars.PANTHEON_SITE || 'civicactions' }}
        run: node .github/ci/pantheon-bot-bypass.mjs

      - name: Run Smoke Tests against Dev
        if: steps.wait-dev.outputs.superseded != 'true'
        working-directory: tests/e2e
        env:
          BASE_URL: "https://dev-${{ vars.PANTHEON_SITE || 'civicactions' }}.pantheonsite.io"
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test --grep "@smoke"

      - name: Notify on Failure
        if: failure()
        uses: ./.github/actions/notify
        with:
          kind: "dev-check-failed"
          title: "Dev Environment Health Check Failed after Master Push (${{ github.sha }})"
          body: |
            A push to `master` (${{ github.sha }}) failed during dev deployment or health verification.
            See [Actions Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.
          resolved: "false"
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          github-token: ${{ steps.app-token.outputs.token }}

  check-auto-deploy:
    name: "Evaluate Auto-Deploy Gate"
    needs: [sync-dev]
    if: needs.sync-dev.outputs.superseded != 'true'
    permissions:
      contents: read
      deployments: write
      issues: write
    uses: ./.github/workflows/auto-deploy-gate.yml
    secrets: inherit
