name: "Deploy to Test and Live"

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Release note or summary"
        required: false
        default: "Manual release from GitHub Actions"
  workflow_call:
    inputs:
      trigger:
        description: "Deployment trigger type (e.g. auto, manual:username)"
        required: true
        type: string
      expected_sha:
        description: "Expected commit SHA to deploy"
        required: true
        type: string
      gate_json:
        description: "Gate evaluation JSON"
        required: false
        type: string
        default: "{}"

concurrency:
  group: pantheon-deploy
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write
  issues: write

jobs:
  deploy-pipeline:
    name: "Execute Deployment Pipeline"
    runs-on: ubuntu-latest
    environment: ${{ inputs.trigger == 'auto' && 'production-auto' || 'production-manual' }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Checkout master tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terminus
        uses: ./.github/actions/terminus-setup
        with:
          pantheon-machine-token: ${{ secrets.TERMINUS_MACHINE_TOKEN }}

      - name: Pre-deployment Diagnostics
        id: precheck
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TRIGGER_TYPE: ${{ inputs.trigger || format('manual:{0}', github.actor) }}
          EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
          GATE_JSON: ${{ inputs.gate_json || '{}' }}
          PANTHEON_SITE: ${{ vars.PANTHEON_SITE || 'civicactions' }}
        run: |
          source .github/ci/pantheon.sh

          DEV_SHA=$(env_sha dev)
          MASTER_SHA="${EXPECTED_SHA}"
          echo "Verifying dev SHA (${DEV_SHA}) matches target SHA (${MASTER_SHA})..."
          if ! sha_matches "${DEV_SHA}" "${MASTER_SHA}" && ! sha_matches "${MASTER_SHA:0:7}" "${DEV_SHA}"; then
            echo "::error::Dev environment (${DEV_SHA}) is not on expected master commit (${MASTER_SHA}). Aborting."
            exit 1
          fi

          # Live pre-check for zero drift and zero pending updates
          .github/ci/live-precheck.sh

          FROM_SHA=$(env_sha live)
          echo "from_sha=${FROM_SHA}" >> "$GITHUB_OUTPUT"
          echo "target_sha=${MASTER_SHA}" >> "$GITHUB_OUTPUT"

      - name: Backup Live Environment
        id: backup
        run: |
          source .github/ci/pantheon.sh
          echo "Creating backup of live environment..."
          terminus backup:create "${PANTHEON_SITE}.live" --keep-for=30
          BACKUP_ID=$(terminus backup:list "${PANTHEON_SITE}.live" --format=json | jq -r '.[0].id // "backup-created"')
          echo "backup_id=${BACKUP_ID}" >> "$GITHUB_OUTPUT"
          echo "Live backup created with ID: ${BACKUP_ID}"

      - name: Initialize Deployment Record
        id: record
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET_SHA: ${{ steps.precheck.outputs.target_sha }}
          FROM_SHA: ${{ steps.precheck.outputs.from_sha }}
          TRIGGER: ${{ inputs.trigger || format('manual:{0}', github.actor) }}
          BACKUP_ID: ${{ steps.backup.outputs.backup_id }}
          GATE_JSON: ${{ inputs.gate_json || '{}' }}
        run: |
          DEP_ID=$(.github/ci/deployment-record.sh create \
            --sha "${TARGET_SHA}" \
            --from-sha "${FROM_SHA}" \
            --trigger "${TRIGGER}" \
            --backup "${BACKUP_ID}" \
            --gate "${GATE_JSON}")
          echo "deployment_id=${DEP_ID}" >> "$GITHUB_OUTPUT"
          .github/ci/deployment-record.sh status --id "${DEP_ID}" --state "in_progress" --desc "Promoting to Test"

      - name: Deploy and Verify Test
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET_SHA: ${{ steps.precheck.outputs.target_sha }}
          PANTHEON_SITE: ${{ vars.PANTHEON_SITE || 'civicactions' }}
        run: |
          source .github/ci/pantheon.sh

          # Re-check dev SHA has not changed (FR-015 / T065)
          CURRENT_DEV=$(env_sha dev)
          if ! sha_matches "${CURRENT_DEV}" "${TARGET_SHA}" && ! sha_matches "${TARGET_SHA:0:7}" "${CURRENT_DEV}"; then
            echo "::error::Dev SHA changed before test promotion! Aborting."
            exit 1
          fi

          echo "Deploying to test with synced live content..."
          terminus env:deploy "${PANTHEON_SITE}.test" --sync-content --note="Deploy ${TARGET_SHA:0:7}"

          wait_workflows test 600
          TEST_SHA=$(env_sha test)
          if ! sha_matches "${TEST_SHA}" "${TARGET_SHA}" && ! sha_matches "${TARGET_SHA:0:7}" "${TEST_SHA}"; then
            echo "::error::Test environment does not match expected SHA ${TARGET_SHA:0:7}."
            exit 1
          fi

          echo "Running drush deploy on test..."
          drush test -- deploy -y

          echo "Running health checks on test..."
          .github/ci/health-check.sh test --phase post

      - name: Run Test Verification Suites (Functional, A11y, Live-vs-Test Visual)
        working-directory: tests/e2e
        env:
          BASE_URL: "https://test-${{ vars.PANTHEON_SITE || 'civicactions' }}.pantheonsite.io"
          REF_URL: "https://live-${{ vars.PANTHEON_SITE || 'civicactions' }}.pantheonsite.io"
        run: |
          npm ci
          npx playwright install --with-deps chromium

          echo "Running functional and accessibility checks on test..."
          npx playwright test --grep "@functional|@a11y"

          echo "Capturing live baseline screenshots..."
          BASE_URL="${REF_URL}" \
            npx playwright test --grep "@visual" --update-snapshots=all || true

          echo "Comparing test screenshots against live baseline..."
          npx playwright test --grep "@visual"

      - name: Deploy and Verify Live
        id: deploy-live
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET_SHA: ${{ steps.precheck.outputs.target_sha }}
          PANTHEON_SITE: ${{ vars.PANTHEON_SITE || 'civicactions' }}
        run: |
          source .github/ci/pantheon.sh

          # Re-check test SHA matches target SHA before promoting to live
          CURRENT_TEST=$(env_sha test)
          if ! sha_matches "${CURRENT_TEST}" "${TARGET_SHA}" && ! sha_matches "${TARGET_SHA:0:7}" "${CURRENT_TEST}"; then
            echo "::error::Test SHA changed before live promotion! Aborting."
            exit 1
          fi

          echo "Deploying code to live..."
          terminus env:deploy "${PANTHEON_SITE}.live" --note="Deploy ${TARGET_SHA:0:7}"

          wait_workflows live 600
          echo "Running drush deploy on live..."
          drush live -- deploy -y

          echo "Clearing caches on live..."
          terminus env:clear-cache "${PANTHEON_SITE}.live"

          echo "Running post-deploy health check on live..."
          .github/ci/health-check.sh live --phase post

      - name: Run Smoke Verification on Live
        working-directory: tests/e2e
        env:
          BASE_URL: "https://live-${{ vars.PANTHEON_SITE || 'civicactions' }}.pantheonsite.io"
        run: |
          npx playwright test --grep "@smoke"

      - name: Finalize Deployment Success
        if: success()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DEP_ID: ${{ steps.record.outputs.deployment_id }}
        run: |
          .github/ci/deployment-record.sh status --id "${DEP_ID}" --state "success" --desc "Successfully deployed to live"

      - name: Handle Deployment Failure
        if: failure()
        uses: ./.github/actions/notify
        with:
          kind: "live-check-failed"
          title: "URGENT: Deployment Failed (${{ steps.precheck.outputs.target_sha }})"
          body: |
            Live deployment failed during promotion or post-deploy health check.
            - **Target Commit**: `${{ steps.precheck.outputs.target_sha }}`
            - **Previous Live Commit**: `${{ steps.precheck.outputs.from_sha }}`
            - **Pre-Deploy Backup**: `${{ steps.backup.outputs.backup_id }}`
            - **Actions Run**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          resolved: "false"
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          github-token: ${{ steps.app-token.outputs.token }}
