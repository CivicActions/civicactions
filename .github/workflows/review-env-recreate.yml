name: "Recreate Review Environment"

run-name: recreate review-env PR #${{ github.event.issue.number }}

# Comment "/recreate-review-env" on a PR to delete its Pantheon multidev and
# push an empty commit, so Pantheon builds a fresh one (current dev content)
# and the review-env checks re-run. Use after a failed multidev creation, or
# when the environment's content is out of date.
on:
  issue_comment:
    types: [created]

# Other comments get a run-scoped group, so they never queue behind a recreate.
concurrency:
  group: >-
    ${{ startsWith(github.event.comment.body, '/recreate-review-env')
    && format('recreate-review-env-{0}', github.event.issue.number)
    || format('recreate-review-env-ignored-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  recreate:
    name: "Recreate Review Environment"
    runs-on: ubuntu-latest
    if: |
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/recreate-review-env')
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Check commenter has write access
        id: permission
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          COMMENTER: ${{ github.event.comment.user.login }}
          COMMENT_ID: ${{ github.event.comment.id }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          PERMISSION=$(gh api "repos/${REPO}/collaborators/${COMMENTER}/permission" -q .permission 2>/dev/null || echo none)
          if [[ ! "${PERMISSION}" =~ ^(admin|maintain|write)$ ]]; then
            gh api "repos/${REPO}/issues/comments/${COMMENT_ID}/reactions" -f content=-1 >/dev/null
            gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
              -f body="@${COMMENTER} \`/recreate-review-env\` needs write access to this repository." >/dev/null
            echo "::error::${COMMENTER} has ${PERMISSION} permission; write is required."
            exit 1
          fi
          gh api "repos/${REPO}/issues/comments/${COMMENT_ID}/reactions" -f content=eyes >/dev/null

      - name: Checkout master tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terminus
        uses: ./.github/actions/terminus-setup
        with:
          pantheon-machine-token: ${{ secrets.TERMINUS_MACHINE_TOKEN }}

      - name: Delete multidev and push empty commit
        id: recreate
        env:
          # The app token makes the push trigger PR workflows; GITHUB_TOKEN pushes don't.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PANTHEON_SITE: ${{ vars.PANTHEON_SITE || 'civicactions' }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENTER: ${{ github.event.comment.user.login }}
        run: |
          NEW_SHA=$(.github/ci/recreate-review-env.sh "${PR_NUMBER}" "${COMMENTER}" | tail -1)
          echo "new_sha=${NEW_SHA}" >> "$GITHUB_OUTPUT"

      - name: Report result
        if: always() && steps.permission.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          NEW_SHA: ${{ steps.recreate.outputs.new_sha }}
          RECREATE_OUTCOME: ${{ steps.recreate.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ "${RECREATE_OUTCOME}" == "success" && -n "${NEW_SHA}" ]]; then
            gh api "repos/${REPO}/issues/comments/${COMMENT_ID}/reactions" -f content=rocket >/dev/null
            gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" -f body="Deleted \`pr-${PR_NUMBER}\` and pushed empty commit ${NEW_SHA:0:7}. Pantheon will build a fresh environment with current dev content, and the review-env checks re-run once it posts \"Successfully created\". ([run](${RUN_URL}))" >/dev/null
          else
            gh api "repos/${REPO}/issues/comments/${COMMENT_ID}/reactions" -f content=confused >/dev/null
            gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" -f body="\`/recreate-review-env\` failed; see the [run](${RUN_URL})." >/dev/null
          fi
