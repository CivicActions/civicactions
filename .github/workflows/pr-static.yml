name: "PR Static Checks"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: static-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  composer:
    name: "Composer Validate & Audit"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Composer Audit
        run: composer audit --locked
        continue-on-error: true

  phpstan:
    name: "PHPStan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse --memory-limit=1G

  phpcs:
    name: "PHP CodeSniffer"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPCS
        run: ./vendor/bin/phpcs

  theme-lint:
    name: "Theme CSS & JS Lint"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2

      - name: Install Drupal Core
        run: composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Cache Drupal Core Yarn dependencies
        uses: actions/cache@v6
        with:
          path: web/core/node_modules
          key: ${{ runner.os }}-core-yarn-${{ hashFiles('web/core/yarn.lock') }}

      - name: Install Drupal Core node_modules
        working-directory: web/core
        run: |
          corepack enable
          corepack yarn install --immutable

      - name: Run Stylelint & ESLint
        env:
          LINT_BASE: origin/${{ github.base_ref }}
        run: |
          STYLELINT="$(pwd)/web/core/node_modules/.bin/stylelint"
          ESLINT="$(pwd)/web/core/node_modules/.bin/eslint"
          THEME_PATH="web/themes/omnichannel"

          css_files=()
          js_files=()
          while IFS= read -r changed_file; do
            case "$changed_file" in
              "$THEME_PATH"/*.css)
                if [[ -f "$changed_file" ]]; then
                  css_files+=("./${changed_file#"$THEME_PATH/"}")
                fi
                ;;
              "$THEME_PATH"/*.js)
                if [[ -f "$changed_file" ]]; then
                  js_files+=("./${changed_file#"$THEME_PATH/"}")
                fi
                ;;
            esac
          done < <(git diff --name-only "$LINT_BASE"...HEAD)

          if [[ ${#css_files[@]} -gt 0 ]]; then
            echo "Linting CSS files: ${css_files[*]}"
            (cd "$THEME_PATH" && "$STYLELINT" --config .stylelint-local.json --config-basedir "$(pwd)/web/core" "${css_files[@]}")
          else
            echo "No changed theme CSS files."
          fi

          if [[ ${#js_files[@]} -gt 0 ]]; then
            echo "Linting JS files: ${js_files[*]}"
            (cd "$THEME_PATH" && "$ESLINT" --config .eslintrc-local.json --resolve-plugins-relative-to "$(pwd)/web/core" "${js_files[@]}")
          else
            echo "No changed theme JS files."
          fi

  storybook:
    name: "Storybook Build"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Build Theme Storybook
        working-directory: web/themes/omnichannel
        run: |
          npm ci
          npm run build-storybook

  dependency-review:
    name: "Dependency Review"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  ci-unit-tests:
    name: "CI Decision Scripts Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Run Node test suite
        run: node --test .github/ci/test/*.test.mjs

  static-result:
    name: "Static Checks Result"
    runs-on: ubuntu-latest
    needs: [composer, phpstan, phpcs, theme-lint, storybook, dependency-review, ci-unit-tests]
    if: always()
    env:
      COMPOSER_RESULT: ${{ needs.composer.result }}
      PHPSTAN_RESULT: ${{ needs.phpstan.result }}
      PHPCS_RESULT: ${{ needs.phpcs.result }}
      THEME_LINT_RESULT: ${{ needs.theme-lint.result }}
      STORYBOOK_RESULT: ${{ needs.storybook.result }}
      DEP_REVIEW_RESULT: ${{ needs.dependency-review.result }}
      UNIT_TESTS_RESULT: ${{ needs.ci-unit-tests.result }}
    steps:
      - name: Check result
        run: |
          if [[ "${COMPOSER_RESULT}" != "success" || \
                "${PHPSTAN_RESULT}" != "success" || \
                "${PHPCS_RESULT}" != "success" || \
                "${THEME_LINT_RESULT}" != "success" || \
                "${STORYBOOK_RESULT}" != "success" || \
                "${DEP_REVIEW_RESULT}" != "success" || \
                "${UNIT_TESTS_RESULT}" != "success" ]]; then
            echo "Static checks failed." >&2
            exit 1
          fi
          echo "All static checks passed."
