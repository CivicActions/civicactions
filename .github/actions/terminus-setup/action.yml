name: "Setup Terminus"
description: "Installs, restores cached session, and authenticates Terminus and SSH for Pantheon"
inputs:
  pantheon-machine-token:
    description: "Pantheon Machine Token"
    required: true
  pantheon-ssh-key:
    description: "Pantheon SSH Private Key (for remote Drush / Git operations)"
    required: false
    default: ""
  config-export-plugin-ref:
    description: "Commit of grugnog/terminus-config-export to install, for `terminus cexr`. Empty skips the plugin."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Setup SSH Agent for Pantheon Drush
      if: inputs.pantheon-ssh-key != ''
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ inputs.pantheon-ssh-key }}

    - name: Configure known_hosts for Pantheon
      if: inputs.pantheon-ssh-key != ''
      shell: bash
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -p 2222 appserver.dev.4f7f3b10-4ed4-408a-a5c0-32aee1264edb.drush.in >> ~/.ssh/known_hosts 2>/dev/null || true

    - name: Setup Terminus and Restore/Cache Authenticated Session
      uses: pantheon-systems/terminus-github-actions@v1
      with:
        pantheon-machine-token: ${{ inputs.pantheon-machine-token }}

    - name: Verify Terminus Authentication
      shell: bash
      run: |
        terminus auth:whoami

    # The fork carries cexr fixes for sites using Pantheon's GitHub
    # integration until they are released upstream (aaronbauman/terminus-config-export#7-#11).
    # Terminus installs plugins from a local path, so fetch the pinned commit.
    - name: Install terminus-config-export plugin
      if: inputs.config-export-plugin-ref != ''
      shell: bash
      env:
        PLUGIN_REF: ${{ inputs.config-export-plugin-ref }}
      run: |
        plugin_dir="${RUNNER_TEMP}/terminus-config-export"
        git init -q "${plugin_dir}"
        # TODO: This can be moved to upstream when PRs are merged.
        git -C "${plugin_dir}" fetch -q --depth 1 https://github.com/grugnog/terminus-config-export.git "${PLUGIN_REF}"
        git -C "${plugin_dir}" checkout -q FETCH_HEAD
        terminus self:plugin:install "${plugin_dir}"
        grep -q "site:config-export-remote" <<< "$(terminus list)"
