name: "Update Gate Status"
description: "Recomputes and writes the required ci/gate status from ci/static, ci/review-env and ci/visual"
inputs:
  sha:
    description: "Commit SHA"
    required: true
  github-token:
    description: "GitHub Token with statuses:write permission"
    required: true

runs:
  using: "composite"
  steps:
    - name: Recompute and post gate status
      shell: bash
      env:
        COMMIT_SHA: ${{ inputs.sha }}
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
      run: node "${GITHUB_ACTION_PATH}/gate.mjs" "${COMMIT_SHA}"
