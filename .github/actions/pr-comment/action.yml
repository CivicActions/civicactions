name: "Upsert PR Comment"
description: "Upserts a unique pull request comment identified by an HTML marker"
inputs:
  pr-number:
    description: "Pull request number"
    required: true
  marker:
    description: "HTML marker (e.g. <!-- ci:review-env -->)"
    required: true
  body:
    description: "Markdown body content"
    required: true
  github-token:
    description: "GitHub Token with pull-requests:write permission"
    required: true

runs:
  using: "composite"
  steps:
    - name: Upsert PR comment
      shell: bash
      env:
        PR_NUM: ${{ inputs.pr-number }}
        MARKER: ${{ inputs.marker }}
        BODY: ${{ inputs.body }}
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
      run: |
        python3 -c "
        import os, sys, urllib.request, json

        token = os.environ['GH_TOKEN']
        repo = os.environ['REPO']
        pr = os.environ['PR_NUM']
        marker = os.environ['MARKER']
        body = os.environ['BODY']

        full_body = f'{marker}\n{body}'

        headers = {
            'Authorization': f'token {token}',
            'Accept': 'application/vnd.github.v3+json',
            'User-Agent': 'civicactions-pr-commenter'
        }

        # Find existing comment with marker
        url = f'https://api.github.com/repos/{repo}/issues/{pr}/comments?per_page=100'
        req = urllib.request.Request(url, headers=headers)
        with urllib.request.urlopen(req) as resp:
            comments = json.loads(resp.read().decode())

        existing_id = None
        for c in comments:
            if marker in c.get('body', ''):
                existing_id = c['id']
                break

        if existing_id:
            print(f'Updating existing comment {existing_id} on PR #{pr}')
            patch_url = f'https://api.github.com/repos/{repo}/issues/comments/{existing_id}'
            payload = json.dumps({'body': full_body}).encode('utf-8')
            patch_req = urllib.request.Request(patch_url, data=payload, headers=headers, method='PATCH')
            urllib.request.urlopen(patch_req)
        else:
            print(f'Creating new comment with marker on PR #{pr}')
            post_url = f'https://api.github.com/repos/{repo}/issues/{pr}/comments'
            payload = json.dumps({'body': full_body}).encode('utf-8')
            post_req = urllib.request.Request(post_url, data=payload, headers=headers)
            urllib.request.urlopen(post_req)
        "
