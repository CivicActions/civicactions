$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Editorial News Teaser
description: News release teaser with a date, summary and full story link. It is not placed directly in Canvas but is rendered by Editorial Teaser.
status: stable
noUi: true
props:
  type: object
  required:
    - title
    - fullstorylink
  properties:
    date:
      type: string
      title: Date
      format: date
    fullstorylink:
      type: string
      title: Full story link
      format: uri-reference
    image:
      $ref: json-schema-definitions://canvas.module/image
      type: object
      title: News image
      description: Optional Media Library image.
      examples:
        - src: '/themes/omnichannel/images/canvas-assets/editorial-teaser-img.jpg'
          alt: 'Traffic light against the sky'
          width: 354
          height: 220
    title:
      type: string
      title: Title
    description:
      type: string
      title: Description
