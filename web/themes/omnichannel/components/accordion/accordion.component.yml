$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Accordion
description: A single collapsible disclosure item with keyboard support.
group: Content
status: stable
props:
  type: object
  required:
    - title
    - heading_level
  properties:
    title:
      type: string
      title: Item title
      description: The question or title shown in the disclosure trigger.
      default: 'What is the class size?'
      examples:
        - 'What is the class size?'
    item_id:
      type: string
      title: Item ID
      description: Optional unique ID used for the disclosure item and its content region.
      default: ''
      examples:
        - faq-class-size
    heading_level:
      type: integer
      title: Heading level
      description: Heading level for the disclosure trigger.
      enum:
        - 2
        - 3
        - 4
        - 5
        - 6
      default: 2
      examples:
        - 2
    open_by_default:
      type: boolean
      title: Open by default
      description: Expand this item when the page loads.
      default: false
      examples:
        - false
slots:
  accordion_content:
    title: Accordion content
    description: Content shown when this item is expanded.
