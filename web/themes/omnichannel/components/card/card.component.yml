$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Card
description: Reusable linked card with an icon, title, and optional body text.
group: Content
status: stable
props:
  type: object
  required:
    - title
    - link
  properties:
    heading_level:
      type: integer
      title: Heading level
      description: Heading level for the card title. Use a lower level when the card sits inside a headed section.
      enum:
        - 2
        - 3
        - 4
        - 5
        - 6
      default: 3
      examples:
        - 3
    title:
      type: string
      title: Title
      default: "Web and CMS"
      examples:
        - "Web and CMS"
    link:
      type: string
      title: Link URL
      format: uri-reference
      default: "/services#web-cms"
      examples:
        - "/services#web-cms"
    icon:
      type: string
      title: Icon URL
      description: "Bundled icons: check.svg, error.svg, feed.svg, help.png, and warning.svg in /themes/omnichannel/images/icons/."
      format: uri-reference
      default: "/themes/omnichannel/images/icons/check.svg"
      examples:
        - "/themes/omnichannel/images/icons/check.svg"
    icon_alt:
      type: string
      title: Icon alternative text
      default: "Service category icon"
      examples:
        - "Service category icon"
    body:
      type: string
      title: Body text
      default: "Accessible digital services for the public good."
      examples:
        - "Accessible digital services for the public good."
