$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Card
description: Reusable linked card with an icon, title, and optional body text.
group: Content
status: stable
props:
  type: object
  required:
    - title
  properties:
    heading_level:
      type: integer
      title: Heading level
      description: Heading level for the card title. Use a lower level when the card sits inside a headed section.
      enum:
        - 2
        - 3
        - 4
        - 5
        - 6
      default: 3
      examples:
        - 3
    title:
      type: string
      title: Title
      default: 'Web and CMS'
      examples:
        - 'Web and CMS'
    link:
      type: string
      title: Link URL
      format: uri-reference
      default: ''
      examples:
        - '/services#web-cms'
    icon:
      type: string
      title: Icon URL
      description: 'Bundled icons: check.svg, error.svg, feed.svg, help.png, and warning.svg in /themes/omnichannel/images/icons/.'
      format: uri-reference
      default: '/themes/omnichannel/images/icons/check.svg'
      examples:
        - '/themes/omnichannel/images/icons/check.svg'
    icon_alt:
      type: string
      title: Icon alternative text
      default: ''
      examples:
        - 'Service category icon'
    icon_name:
      type: string
      title: Icon name
      description: 'Bundled icon symbol from the Icon SDC, or none to hide the card icon.'
      enum:
        - none
        - check
        - calendar
        - certificate
        - users
        - arrow
        - document
        - star
        - web-cms
        - it-modernization
        - data-services
        - product-design
        - security-compliance
        - workforce-dev
        - health-benefits
        - 401k-program
        - time-off
        - remote-life
        - annual-upgrades
        - family-friendly
      meta:enum:
        none: No icon
        check: Checkmark
        calendar: Calendar
        certificate: Certificate
        users: Users / Community
        arrow: Arrow Right
        document: Document
        star: Star
        web-cms: Web / CMS 
        it-modernization: IT Modernization
        data-services: Data Services
        product-design: Product Design
        security-compliance: Security Compliance
        workforce-dev: Workforce Development
        health-benefits: Health Benefits
        401k-program: 401k Program
        time-off: Time Off
        remote-life: Remote Life
        annual-upgrades: Annual Upgrades
        family-friendly: Family Friendly
      default: none
      examples:
        - none
    body:
      type: string
      title: Body text
      default: 'Accessible digital services for the public good.'
      examples:
        - 'Accessible digital services for the public good.'
