$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Layout Section
description: Responsive CSS Grid section with two-, three-, and four-column layout options.
group: Layout
status: stable
props:
  type: object
  required:
    - layout
  properties:
    layout:
      type: string
      title: Column layout
      enum:
        - one
        - two-equal
        - three-equal
        - two-one
        - one-two
        - four-equal
      meta:enum:
        one: One column
        two-equal: Two columns (50/50)
        three-equal: Three columns (equal)
        two-one: Two columns (25/75)
        one-two: Two columns (75/25)
        four-equal: Four columns (equal)
      default: two-equal
      examples:
        - two-equal
    padding:
      type: string
      title: Section padding
      description: CSS padding for the section.
      enum:
        - small
        - medium
        - large
      default: medium
      meta:enum:
        small: Small padding
        medium: Medium padding
        large: Large padding
    alignment:
      type: string
      title: Vertical alignment for the section columns
      enum:
        - top
        - center
        - bottom
      default: top
      meta:enum:
        top: Align content to the top
        center: Center content vertically
        bottom: Align content to the bottom
    background_color:
      type: string
      title: Section background color
      description: CSS background color for the section.
      enum:
        - white
        - gray
        - blue
        - red
      default: white
      meta:enum:
        white: White
        gray: Light Gray
        blue: Blue
        red: Red
    width:
      type: string
      title: Section width
      description: CSS width for the section.
      enum:
        - full
        - constrained
      default: full
      meta:enum:
        full: Full width
        constrained: Constrained width
    section_id:
      type: string
      title: Section anchor ID
      description: Optional anchor target used by in-page links.
      default: services
      examples:
        - services
    title:
      type: string
      title: Section title
      description: Optional heading displayed above the section columns.
      default: Services
      examples:
        - Services
    heading_level:
      type: integer
      title: Section title heading level
      description: Heading level for the optional section title.
      enum:
        - 2
        - 3
        - 4
      default: 2
      examples:
        - 2
slots:
  column_one:
    title: First column
    description: Content displayed in the first column.
  column_two:
    title: Second column
    description: Content displayed in the second column.
  column_three:
    title: Third column
    description: Content displayed in the third column when using the three-column layout.
  column_four:
    title: Fourth column
    description: Content displayed in the fourth column when using the four-column layout.
