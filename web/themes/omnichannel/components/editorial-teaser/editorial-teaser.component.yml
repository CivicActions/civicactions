$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Editorial Teaser
description: Linked content teaser for press releases (image card or compact title-and-arrow link) and news.
group: Teasers
status: stable
props:
  type: object
  required:
    - teaserlink
    - title
  properties:
    variant:
      type: string
      title: Content type
      enum:
        - press
        - news
      meta:enum:
        press: Press release
        news: News
      default: press
      examples:
        - press
    layout:
      type: string
      title: Press release layout
      description: Only used when the content type is Press release.
      enum:
        - card
        - compact
      meta:enum:
        card: Image card
        compact: Title and arrow
      default: card
      examples:
        - card
    teaserlink:
      type: string
      title: Teaser link
      description: Used for press releases. News uses the full story link.
      format: uri-reference
      default: '/press-releases/example'
      examples:
        - '/press-releases/example'
    date:
      type: string
      title: News date
      description: Only used when the content type is News.
      format: date
      # Canvas cannot yet store a default or example for date props without a
      # config schema error (canvas.module issue 3530808).
    fullstorylink:
      type: string
      title: Full story link
      description: Only used when the content type is News.
      format: uri-reference
      default: '/press/example'
      examples:
        - '/press/example'
    image:
      $ref: json-schema-definitions://canvas.module/image
      type: object
      title: Card image
      description: Image selected from the Media Library.
      examples:
        - src: '/themes/omnichannel/images/canvas-assets/editorial-teaser-img.jpg'
          alt: 'Traffic light against the sky'
          width: 354
          height: 220
    title:
      type: string
      title: Title
      default: 'CivicActions announces a public-sector partnership'
      examples:
        - 'CivicActions announces a public-sector partnership'
    description:
      type: string
      title: Description
      default: 'Learn more about this announcement.'
      examples:
        - 'Learn more about this announcement.'
