id: civicactions_people_profiles
migration_tags:
  - content
source:
  plugin: civicactions_people_archive_profiles
  metadata_path: people_archive/metadata.json
  asset_public_directory: public://people_archive_assets
process:
  title:
    plugin: get
    source: title
  schema_job_title:
    plugin: get
    source: job_title
  schema_image/target_id:
    plugin: get
    source: schema_image_target_id
  schema_member_of:
    plugin: sub_process
    source: schema_member_of_items
    process:
      target_id: target_id
  schema_works_for/target_id:
    plugin: get
    source: schema_works_for_target_id
  status:
    plugin: default_value
    default_value: 1
  promote:
    plugin: default_value
    default_value: 0
  sticky:
    plugin: default_value
    default_value: 0
  langcode:
    plugin: default_value
    default_value: en
destination:
  plugin: 'entity:node'
  default_bundle: person
