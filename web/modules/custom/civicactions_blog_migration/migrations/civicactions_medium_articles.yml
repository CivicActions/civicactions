id: civicactions_medium_articles
migration_tags:
  - content
source:
  plugin: civicactions_blog_archive_posts
  metadata_path: blog_archive/metadata.json
  asset_public_directory: public://blog_archive_assets
process:
  title:
    plugin: get
    source: title
  field_editorial_type/target_id:
    plugin: get
    source: editorial_type_target_id
  schema_author/target_id:
    plugin: get
    source: schema_author_target_id
  schema_short_description:
    plugin: get
    source: subtitle
  schema_image/target_id:
    plugin: get
    source: schema_image_target_id
  schema_article_body:
    plugin: sub_process
    source: field_content_items
    process:
      target_id: target_id
      target_revision_id: target_revision_id
  created:
    plugin: format_date
    from_format: 'Y-m-d\TH:i:s.u\Z'
    to_format: U
    source: published_at
  status:
    plugin: default_value
    default_value: 1
  promote:
    plugin: default_value
    default_value: 0
  sticky:
    plugin: default_value
    default_value: 0
  langcode:
    plugin: default_value
    default_value: en
destination:
  plugin: 'entity:node'
  default_bundle: editorial
