id: ditap_rfi
title: 'DITAP RFI'
description: '<p>RFI form for DITAP cohorts.</p>'
categories: {  }
elements: "your_email:\n  '#type': email\n  '#title': 'Your email'\n  '#required': true\nyour_name:\n  '#type': textfield\n  '#title': 'Your name'\n  '#description': \"<p>If you need to register other people for DITAP, you'll have a chance to enter their names later.</p>\"\n  '#required': true\norganization:\n  '#type': textfield\n  '#title': Organization\n  '#required': true\nwhat_do_you_want_to_do:\n  '#type': webform_radios_other\n  '#title': 'What do you want to do?'\n  '#options':\n    'Request training for one or more people (less than 25)': 'Request training for one or more people (less than 25)'\n    'Request training for 25-30 people (a full cohort)': 'Request training for 25-30 people (a full cohort)'\n    'Request training for more than 30 people': 'Request training for more than 30 people'\nhow_many_people_would_you_like_to_register:\n  '#type': textfield\n  '#title': 'How many people would you like to register?'\nwhat_is_your_earliest_available_start_date_for_training_this_is:\n  '#type': date\n  '#title': 'What is your earliest available start date for training? (This is a 6-month program.)'\nthe_ditap_program_requires_that_participants_have_at_least_a_fac:\n  '#type': webform_radios_other\n  '#title': 'The DITAP program requires that participants have at least a FAC-C Level II certification. Do you (and/or the people you are registering) meet this qualification?'\n  '#description': '<p><span style=\"-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(31, 31, 31);display:inline !important;float:none;font-family:Roboto, Arial, sans-serif;font-size:14.6667px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;\">Participants may also be working toward the FAC-C Level II, with planned completion prior to the DITAP program conclusion. Additionally, supervisor permission may be given for people without that certification level to take the training.</span></p>'\n  '#options':\n    'Yes': 'Yes'\n    'No, but supervisor permission is being given to take the training.': 'No, but supervisor permission is being given to take the training.'\nditap_training_is_7_000_per_participant_unless_we_have_arranged:\n  '#type': radios\n  '#title': 'DITAP training is $7,000 per participant, unless we have arranged a special rate for you. How would you like to pay?'\n  '#options':\n    'Credit card - right now (You will be given a checkout link when you submit this form)': 'Credit card - right now (You will be given a checkout link when you submit this form)'\n    'Purchase order - send me more information': 'Purchase order - send me more information'\n    \"I'm not sure - please contact me\": \"I'm not sure - please contact me\"\nanything_else_you_want_to_tell_us_or_ask_us:\n  '#type': textarea\n  '#title': 'Anything else you want to tell us or ask us?'\ncaptcha:\n  '#type': captcha"
