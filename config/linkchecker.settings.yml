check_links_types: 1
default_url_scheme: 'https://'
base_path: ''
extract:
  from_a: true
  from_audio: false
  from_embed: false
  from_iframe: false
  from_img: true
  from_object: false
  from_video: false
  filter_blacklist:
    filter_align: filter_align
    filter_autop: filter_autop
    filter_caption: filter_caption
    insert_block: insert_block
    insert_view: insert_view
    smiley: smiley
    smileys: smileys
    weblinks_embed: weblinks_embed
    weblinks_filter: weblinks_filter
check:
  connections_max: 4
  connections_max_per_domain: 1
  disable_link_check_for_urls: ''
  library: core
  interval: 604800
  useragent: 'Drupal (+http://drupal.org/)'
error:
  action_status_code_301: 0
  action_status_code_404: 0
  ignore_response_codes: "200\n206\n302\n304\n401\n403"
  impersonate_account: ''
logging:
  level: 5
